<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Login - Makadara</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-icon">🏥</div>
    <h2>MAKADARA HEALTHCARE CENTRE</h2>
    <p>Staff & Owner Portal - Athi River</p>
    <span class="badge-red">🔒 AUTHORIZED STAFF ONLY</span>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Staff Email" value="accounts@makadara.co.ke" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit" class="btn-login">Login to Dashboard</button>
      <p id="err"></p>
    </form>
  </div>
<script src="js/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  if (!res.ok) { document.getElementById('err').innerText = data.error || 'Login failed'; return; }
  localStorage.setItem('token', data.token);
  localStorage.setItem('role', data.role);
  location.href = data.role === 'accountant' ? 'accountant.html' : 'dashboard.html';
});
</script>
</body>
</html>
