<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Login - Makadara</title>
<style>
.lamp{
  width:80px;
  height:80px;
  background:#ffd369;
  border-radius:50%;
  margin:0 auto 20px;
  box-shadow:0 0 30px #ffd369;
  animation:glow 2s infinite;
}

@keyframes glow{
  0%,100%{box-shadow:0 0 20px #ffd369;}
  50%{box-shadow:0 0 50px #ffc107;}
}

.login-container{
  text-align:center;
  padding:40px;
  background:#0d1117;
  border-radius:15px;
  width:320px;
  margin:80px auto;
  color:#fff;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
  animation:fadeIn 1s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}

input{
  width:90%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:8px;
  background:#161b22;
  color:#fff;
  outline:none;
}

button{
  width:95%;
  padding:12px;
  background:linear-gradient(45deg,#00aaff,#007bff);
  border:none;
  color:#fff;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #00aaff;
}
</style>
</head>
  <body>
<div class="login-container">
  <div class="lamp"></div>
  <h2>Welcome Back</h2>
  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">
  <button>Login</button>
</div>
  </body>
</html>
