<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Makadara Login</title><style>body{font-family:Arial;background:#f4f6f9;display:flex;justify-content:center;padding:40px}.box{background:#fff;padding:25px;border-radius:12px;width:100%;max-width:350px}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}button{width:100%;padding:12px;background:#0a3d62;color:#fff;border:0;border-radius:8px}</style></head><body><div class="box"><h2>Makadara</h2><p>Till 416930</p><input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg" style="color:red"></p></div><script>async function login(){const email=document.getElementById('email').value;const password=document.getElementById('pass').value;const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok){document.getElementById('msg').textContent='Wrong login - check email/password';return}localStorage.setItem('token',d.token);localStorage.setItem('role',d.role);location.href=d.role==='owner'?'/dashboard.html':'/accountant.html'}</script></body></html>
